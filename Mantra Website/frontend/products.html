<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | SmartCart</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Smart</span>Cart
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="analytics.html">Analytics</a>
        <a href="track-order.html">Track Order</a>
    </nav>

    <a href="cart.html" class="cart-btn">
        🛒 Cart
        <span id="cart-count">0</span>
    </a>

</header>


<main class="products-page">

    <div class="page-title">

        <p>SMART RETAIL CATALOG</p>

        <h1>Explore Products</h1>

        <p>
            Browse products from our retail inventory dataset.
        </p>

    </div>


    <div class="filter-container glass">

        <button onclick="filterProducts('All')">
            📦 All Products
        </button>

        <button onclick="filterProducts('Furniture')">
            🪑 Furniture
        </button>

        <button onclick="filterProducts('Office Supplies')">
            📎 Office Supplies
        </button>

        <button onclick="filterProducts('Technology')">
            💻 Technology
        </button>

    </div>


    <div id="product-container" class="product-grid">

    </div>

</main>


<footer>

    <div class="footer-content">

        <h2>Smart<span>Cart</span></h2>

        <p>
            Smart Retail Analytics & Inventory Management System
        </p>

    </div>

</footer>

<script src="js/app.js"></script>
<script src="js/products.js"></script>

</body>
</html>
